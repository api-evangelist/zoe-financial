aid: zoe-financial
name: Zoe Financial
description: >-
  Zoe Financial is a New York based wealth management technology company operating a two-sided
  platform: Advisor Match, a concierge and algorithmic service connecting individuals with vetted
  independent fiduciary financial advisors, and the Zoe Wealth Platform, an all-in-one TAMP for
  registered investment advisers covering digital account opening, funding and ACAT transfers,
  sub-advisory trade execution, household-level automated rebalancing, tax-loss harvesting, a model
  marketplace, high-yield cash accounts, private labeling and outsourced middle-office operations.
  Zoe Financial, Inc. is an SEC-registered investment adviser (CRD 285158) and affiliate Zoe
  Securities LLC is a FINRA and SIPC member broker-dealer (CRD 326979), custodying through Apex
  Clearing and Charles Schwab. Zoe consumes partner APIs (BridgeFT, Salesforce, eMoney) but
  publishes no public API, SDK, developer portal or machine-readable contract of its own.
